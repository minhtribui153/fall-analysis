services:
    kafka:
        image: apache/kafka:latest
        container_name: sg-nyp-a1-eg2a17-kafka
        ports:
            - "9092:9092"
        environment:
            KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092"
            KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_NODE_ID: 1
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        volumes:
            - ${DIR_DATA}/instances/kafka:/var/lib/kafka/data

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: sg-nyp-a1-eg2a17-kafka-ui
        ports:
            - "8080:8080"
        environment:
            DYNAMIC_CONFIG_ENABLED: 'true'
            KAFKA_CLUSTERS_0_NAME: 'local-kraft'
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'
        depends_on:
            - kafka