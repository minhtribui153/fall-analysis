services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sg-nyp-a1-eg2a17-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${DIR_DATA}/instances/mosquitto/data:/mosquitto/data
      - ${DIR_DATA}/instances/mosquitto/log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    networks:
      - bridge_network

networks:
  bridge_network:
    driver: bridge