[platformio]
default_envs = nesso_n1

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200

[env:esp32_dev]
board = esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32_dev

build_flags =
    -D TERVANIX_BOARD_ESP32_DEV=1
    -D TERVANIX_BOARD_NAME=\"Tervanix-ESP32\"

[env:nesso_n1]
board = esp32-c6-devkitc-1
board_build.esp-idf.sdkconfig_path = sdkconfig.nesso_n1
board_build.flash_mode = dio

; The physical Nesso N1 reports 2MB flash. Keep PlatformIO's board
; metadata aligned with the ESP-IDF sdkconfig.
board_upload.flash_size = 2MB

; ESP-IDF's normal single-app table only gives the application 1 MiB.
; This firmware is ~1.40 MB, so use ESP-IDF's built-in 1.5 MiB
; single-app layout and tell PlatformIO's size checker the same limit.
board_build.partitions = partitions_singleapp_large.csv
board_upload.maximum_size = 1572864

build_flags =
    -D TERVANIX_BOARD_NESSO_N1=1
    -D TERVANIX_BOARD_NAME=\"Tervanix-Nesso-N1\"