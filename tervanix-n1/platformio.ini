[platformio]
default_envs = nesso_n1

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200
build_unflags = -std=gnu++11

[env:esp32_dev]
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = partitions.esp32_dev.csv
board_build.filesystem = spiffs
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32_dev
build_flags =
    -std=gnu++17
    -D TERVANIX_BOARD_ESP32_DEV=1
    -D TERVANIX_BOARD_NAME=\"Tervanix-ESP32\"
    -D __STDC_FORMAT_MACROS

[env:nesso_n1]
board = esp32-c6-devkitc-1
board_build.esp-idf.sdkconfig_path = sdkconfig.nesso_n1
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions.nesso_n1.csv
build_flags =
    -std=gnu++17
    -D TERVANIX_BOARD_NESSO_N1=1
    -D TERVANIX_BOARD_NAME=\"Tervanix-Nesso-N1\"
    -D TERVANIX_HAS_IMU=1
    -D __STDC_FORMAT_MACROS