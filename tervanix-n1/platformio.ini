[platformio]
default_envs = nesso_n1

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200

[env:esp32_dev]
board = esp32dev
board_build.sdkconfig = sdkconfig.esp32_dev

build_flags =
    -D TERVANIX_BOARD_ESP32_DEV=1
    -D TERVANIX_BOARD_NAME=\"Tervanix-ESP32\"

[env:nesso_n1]
board = esp32-c6-devkitc-1
board_build.sdkconfig = sdkconfig.nesso_n1
board_build.flash_mode = dio
board_build.flash_size = 2MB
lib_deps =
    https://github.com/minhtribui153/fall-analysis

build_flags =
    -D TERVANIX_BOARD_NESSO_N1=1
    -D TERVANIX_BOARD_NAME=\"Tervanix-Nesso-N1\"