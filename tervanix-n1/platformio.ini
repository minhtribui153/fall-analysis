; PlatformIO Project Configuration File

[platformio]
default_envs = nesso_n1

; For Nesso N1 / ESP32-C6
[env:nesso_n1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB


; For ESP32-D / ESP32 DevKit / ESP32-WROOM-32
[env:esp32d]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.flash_size = 4MB